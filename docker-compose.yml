# Full stack: web + api + ai-service + MariaDB + Mailpit
# One command:  docker compose up --build
#            or ./scripts/up.sh   |   make up
# Optional LLM (Ollama + phi4):  docker compose --profile llm up --build
#                             or ./scripts/up.sh --llm   |   make up-llm
#
# Copy .env.example → .env first (placeholders only). Do not commit secrets.

name: nbts-blood-ai

services:
  web:
    build:
      context: ./web
      args:
        # Baked into the Vite client bundle at image build time (not runtime).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    environment:
      PORT: "3000"
      # Documented only — browser bundle already baked; rebuild web to change API URL.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "${WEB_HOST_PORT:-5173}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3000}
      PORT: ${API_PORT:-3000}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-nbts_blood_ai}
      DB_USER: ${DB_USER:-nbts}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      # Always Compose DNS — do not inherit host 127.0.0.1 from .env
      AI_SERVICE_URL: http://ai-service:8000
      # AI-service callback URL for API-owned assistant tools.
      API_INTERNAL_BASE_URL: http://api:3000
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-30000}
      AI_TRAIN_TIMEOUT_MS: ${AI_TRAIN_TIMEOUT_MS:-120000}
      AI_HEALTH_TIMEOUT_MS: ${AI_HEALTH_TIMEOUT_MS:-5000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-no-reply@nbts.local}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-Strict}
      # Browser origins (CORS + CSRF). Must include the URL you open in the browser.
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:5173,http://localhost:3000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      # Direct Ollama Cloud by default; use http://ollama:11434 for the local profile.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      ALERT_SEVERITY_LOW_MIN: ${ALERT_SEVERITY_LOW_MIN:-0.01}
      ALERT_SEVERITY_MEDIUM_MIN: ${ALERT_SEVERITY_MEDIUM_MIN:-10}
      ALERT_SEVERITY_HIGH_MIN: ${ALERT_SEVERITY_HIGH_MIN:-25}
      ALERT_SEVERITY_CRITICAL_MIN: ${ALERT_SEVERITY_CRITICAL_MIN:-50}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@nbts.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-ChangeMe-Admin-Local-Only!}
      DEMO_OFFICER_EMAIL: ${DEMO_OFFICER_EMAIL:-officer@nbts.local}
      DEMO_OFFICER_PASSWORD: ${DEMO_OFFICER_PASSWORD:-ChangeMe-Officer-Local-Only!}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-false}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nbts.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe-Admin-Local-Only!}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      SEED_DEMO_OPERATIONS: ${SEED_DEMO_OPERATIONS:-true}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    environment:
      MODEL_DIR: /app/models
      DEFAULT_FORECAST_HORIZON: ${DEFAULT_FORECAST_HORIZON:-7}
      MIN_TRAINING_ROWS: ${MIN_TRAINING_ROWS:-30}
      # Local Docker test path defaults to Ollama + phi4. Override to openai in prod.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_FORECAST_DEFAULT: ${LLM_FORECAST_DEFAULT:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      API_INTERNAL_BASE_URL: http://api:3000
    ports:
      - "${AI_HOST_PORT:-8000}:8000"
    volumes:
      - ai_models:/app/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-nbts_blood_ai}
      MARIADB_USER: ${DB_USER:-nbts}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-me}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles:
      - llm
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Pulls phi4 once when the llm profile is enabled (idempotent if already present).
  ollama-init:
    image: ollama/ollama:latest
    profiles:
      - llm
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling Ollama model: $${OLLAMA_MODEL:-phi4}"
        ollama pull "$${OLLAMA_MODEL:-phi4}"
        echo "Model ready."
    restart: "no"

volumes:
  db_data:
  ai_models:
  ollama_data:
